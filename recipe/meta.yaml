{% set name = "minorminer" %}
{% set version = "0.2.21" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # The PyPI sdist ships the glasgow-subgraph-solver and portable-snippets
  # git submodules; the GitHub tag archive does not.
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/minorminer-{{ version }}.tar.gz
  sha256: 41fee0b231b2cd695723830044fb83ad953d0d10017eb6c78751ac3e7efa2203
  patches:
    - patches/0001-Use-rectangle-packer-instead-of-vendored-rpack.patch

build:
  number: 0
  script:
    # Drop the vendored rpack and the pre-generated Cython sources so they are rebuilt with our Cython.
    - rm -rf minorminer/_extern minorminer/*.cpp  # [unix]
    - rmdir /s /q minorminer\_extern  # [win]
    - del /q minorminer\*.cpp  # [win]
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  build:
    - python                                 # [build_platform != target_platform]
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython >=3.0.6                         # [build_platform != target_platform]
    - {{ compiler('cxx') }}
    - {{ stdlib("c") }}
  host:
    - cython >=3.0.6
    - pip
    - python
    - setuptools >=46.4.0
    - wheel
  run:
    - dwave-networkx >=0.8.13
    - fasteners >=0.15
    - homebase >=1.0.1
    - networkx >=2.4
    - numpy >=1.21.6
    - python
    - rectangle-packer >=2.0.2
    - scipy >=1.7.3

test:
  imports:
    - minorminer
    - minorminer.busclique
    - minorminer.subgraph
    - minorminer.layout
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/dwavesystems/minorminer
  summary: Heuristic algorithm to find graph minor embeddings
  license: Apache-2.0 AND MIT AND CC0-1.0
  license_file:
    - LICENSE
    - external/glasgow-subgraph-solver/LICENCE
    - external/portable-snippets/COPYING.md

extra:
  recipe-maintainers:
    - BastianZim
